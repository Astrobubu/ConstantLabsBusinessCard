<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Constant Labs Cards</title>
<style>
  @font-face { font-family: "AC Compacta"; src: url("assets/fonts/AC-Compacta.otf") format("opentype"); font-display: block; }
  @font-face { font-family: "Geist Mono"; font-weight: 400; src: url("assets/fonts/GeistMono-Regular.woff2") format("woff2"); font-display: block; }
  @font-face { font-family: "Geist Mono"; font-weight: 500; src: url("assets/fonts/GeistMono-Medium.woff2") format("woff2"); font-display: block; }
  @font-face { font-family: "Geist Pixel"; src: url("assets/fonts/GeistPixel-Circle.woff2") format("woff2"); font-display: block; }

  :root {
    --ink: #0A0F0D;
    --teal: #3E8C7A;
    --cyan: #39AC99;
    --cream: #EDE8DC;
    --page: #161917;
    --page-text: #EDE8DC;
    --page-dim: #8A928E;
    /* Card is 85 x 55 mm, drawn at 300 dpi: 1004 x 650 px. */
    --cw: 1004px;
    --ch: 650px;
    --radius: 41px; /* 3.5 mm */
    --s: 0.46;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { background: var(--page); color: var(--page-text); font-family: "Geist Mono", ui-monospace, monospace; -webkit-font-smoothing: antialiased; }

  header.page { padding: 48px 40px 8px; max-width: 1180px; margin: 0 auto; }
  header.page h1 { font-family: "AC Compacta", sans-serif; font-weight: 400; font-size: 64px; line-height: .9; letter-spacing: .005em; text-transform: uppercase; }
  header.page p { color: var(--page-dim); font-size: 13px; margin-top: 12px; line-height: 1.6; max-width: 70ch; }

  main { max-width: 1180px; margin: 0 auto; padding: 24px 40px 96px; display: grid; gap: 56px; }
  .pair h2 { font-size: 12px; font-weight: 500; letter-spacing: .14em; text-transform: uppercase; color: var(--page-dim); margin-bottom: 14px; }
  .pair h2 b { color: var(--page-text); font-weight: 500; margin-right: 10px; }
  .faces { display: flex; gap: 28px; flex-wrap: wrap; }

  .slot { width: calc(var(--cw) * var(--s)); height: calc(var(--ch) * var(--s)); flex: none; position: relative; }
  .slot > .card { transform: scale(var(--s)); transform-origin: 0 0; position: absolute; top: 0; left: 0; box-shadow: 0 30px 60px -20px rgba(0,0,0,.6), 0 0 0 1px rgba(255,255,255,.04); }

  .card { width: var(--cw); height: var(--ch); border-radius: var(--radius); overflow: hidden; position: relative; isolation: isolate; }
  .card > * { position: absolute; }
  .card canvas.field { display: block; image-rendering: pixelated; z-index: 0; }
  .card .z { z-index: 1; }

  .mono { font-family: "Geist Mono", monospace; font-weight: 400; letter-spacing: .08em; }
  .mono-m { font-family: "Geist Mono", monospace; font-weight: 500; letter-spacing: .08em; }
  .pixel { font-family: "Geist Pixel", "Geist Mono", monospace; }
  .compacta { font-family: "AC Compacta", sans-serif; font-weight: 400; text-transform: uppercase; line-height: 1; white-space: nowrap; transform-origin: 0 0; }
  .logo { display: block; overflow: visible; }
  .qr { display: block; }
  .rule { height: 2px; }

  /* Single-face export mode: ?face=a-front renders one card at native size, square corners. */
  body.export { background: transparent; }
  body.export header.page, body.export .pair h2 { display: none; }
  body.export main { padding: 0; margin: 0; max-width: none; display: block; }
  body.export .faces { display: block; }
  body.export .slot { width: var(--cw); height: var(--ch); }
  body.export .slot > .card { transform: none; box-shadow: none; border-radius: 0; }

  @media (max-width: 720px) {
    :root { --s: calc((100vw - 32px) / 1004); }
    header.page, main { padding-left: 16px; padding-right: 16px; }
    header.page h1 { font-size: 44px; }
  }
</style>
</head>
<body>
<header class="page">
  <h1>Constant Labs<br>Business Cards</h1>
  <p>85 × 55 mm, rounded 3.5 mm corners. Dither fields are the site's own shader (nebulaVeil, ridges, warp, wireTerrain) rendered once at print resolution. Type: AC Compacta and Geist Mono. Every QR points to constantlabs.ai.</p>
</header>
<main id="cards"></main>

<script src="assets/data.js"></script>

const DPR = Number(params.get("dpr")) || 2;

/* ---------- logo ---------- */
const L = CL.logo;
const ARABIC = [`${L.arabic[0]} ${L.arabic[1]}`, ...L.arabic.slice(2)];
const LOGO_PARTS = {
  full: [L.english, ...ARABIC],
  english: [L.english],
  arabic: ARABIC,
};
const BOXES = {};
(function measureLogo() {
  const svg = document.createElementNS("http://www.w3.org/2000/svg", "svg");
  svg.setAttribute("style", "position:absolute;visibility:hidden;width:0;height:0");
  document.body.appendChild(svg);
  for (const [k, ds] of Object.entries(LOGO_PARTS)) {
    const g = document.createElementNS(svg.namespaceURI, "g");
    g.innerHTML = ds.map((d) => `<path d="${d}"/>`).join("");
    svg.appendChild(g);
    const b = g.getBBox();
    BOXES[k] = [b.x, b.y, b.width, b.height];
  }
  svg.remove();
})();
/* size: {w} or {h}, in card px */
function logo(part, color, style, size) {
  const [x, y, w, h] = BOXES[part];
  const width = size.w ?? (size.h * w) / h;
  const height = size.h ?? (size.w * h) / w;
  return `<svg class="logo z" viewBox="${x} ${y} ${w} ${h}" width="${width}" height="${height}" fill="${color}" fill-rule="evenodd" style="${style}">${LOGO_PARTS[part].map((d) => `<path d="${d}"/>`).join("")}</svg>`;
}

/*
  ---------- QR ----------
  No chip: the modules are drawn straight onto the card in the theme's colour.
  The card's own margin is the quiet zone, so nothing may sit within ~5 modules
  of it. Light-on-dark codes are inverted; current iOS and Android cameras read
  them, but test-scan a printed proof before a full run.
*/
const qrView = CL.qr.match(/viewBox="([^"]+)"/)[1];
const qrPath = [...CL.qr.matchAll(/<path[^>]*stroke="[^"]+"[^>]*d="([^"]+)"/g)].map((m) => m[1])[0]
  ?? [...CL.qr.matchAll(/d="([^"]+)"/g)].map((m) => m[1]).pop();
function qr(size, color, style) {
  return `<svg class="qr z" viewBox="${qrView}" width="${size}" height="${size}" shape-rendering="crispEdges" style="${style}"><path d="${qrPath}" stroke="${color}" fill="none"/></svg>`;
}

/* ---------- dither field ---------- */
const PROFILES = {
  hero:    { src: "nebulaVeil", scale: 1,   rot: 51, contrast: 1.15, balance: 0.03,  t: 145 + 6 },
  ridges:  { src: "ridges",     scale: 5,   rot: 0,  contrast: 1.41, balance: -0.16, t: 22 },
  band:    { src: "warp",       scale: 2,   rot: 90, contrast: 1.15, balance: 0.06,  t: 30 },
  terrain: { src: "wireTerrain",scale: 1,   rot: 0,  contrast: 1.2,  balance: -0.1,  t: 12 },
  veilWide:{ src: "nebulaVeil", scale: 0.7, rot: 20, contrast: 1.2,  balance: 0.0,   t: 145 + 18 },
};
function field(profile, fg, bg, style, cell = 3, overrides = {}) {
  const p = { ...PROFILES[profile], ...overrides };
  return `<canvas class="field" style="${style}" data-src="${p.src}" data-scale="${p.scale}" data-rot="${p.rot}" data-contrast="${p.contrast}" data-balance="${p.balance}" data-t="${p.t}" data-cell="${cell}" data-fg="${fg}" data-bg="${bg}"></canvas>`;
}

        <div class="mono z" style="left:60px;top:266px;font-size:20px;color:${INK};letter-spacing:.14em">${P.tag}</div>
        ${qr(210, INK, "right:60px;bottom:60px")}
      </div>`,
  },
];

/* ---------- mount ---------- */
const onlyFace = params.get("face"); // e.g. "b-front"
if (onlyFace) document.body.classList.add("export");
document.getElementById("cards").innerHTML = CARDS.map((c) => {
  const faces = ["front", "back"].filter((f) => !onlyFace || onlyFace === `${c.id}-${f}`);
  if (!faces.length) return "";
  return `<section class="pair"><h2><b>${c.id.toUpperCase()} · ${c.title}</b>${c.note}</h2>
    <div class="faces">${faces.map((f) => `<div class="slot" data-face="${c.id}-${f}">${c[f]}</div>`).join("")}</div></section>`;
}).join("");

/*
  Fit big type by its INK, not its line box.

  Compacta's caps sit well inside its em box, so line-height tricks put the
  glyphs somewhere unpredictable. Canvas metrics give the real cap top, cap
  height and side bearing, so an element's left/top are where the ink starts
  and data-fit is the ink's exact width. data-same="<id>" reuses another
  line's size so stacked words match, as on the reference plate.
*/
const METRICS = {};
function fitType() {
  const ctx = document.createElement("canvas").getContext("2d");
  const font = (s) => `400 ${s}px "AC Compacta"`;
  document.querySelectorAll(".fit").forEach((el) => {
    const text = el.textContent.trim().toUpperCase();
    ctx.font = font(100);
    const m100 = ctx.measureText(text);
    const size = el.dataset.same
      ? METRICS[el.dataset.same].size
      : (100 * Number(el.dataset.fit)) / (m100.actualBoundingBoxLeft + m100.actualBoundingBoxRight);
    ctx.font = font(size);
    const m = ctx.measureText(text);
    const sy = Number(el.dataset.sy || 1);
    const baseline = (size - (m.fontBoundingBoxAscent + m.fontBoundingBoxDescent)) / 2 + m.fontBoundingBoxAscent;
    const off = baseline - m.actualBoundingBoxAscent;
    Object.assign(el.style, {
      fontSize: `${size}px`,
      lineHeight: "1",
      marginTop: `${-off}px`,
      marginLeft: `${m.actualBoundingBoxLeft}px`,
      transformOrigin: `0 ${off}px`,
      transform: `scaleY(${sy})`,
    });
    if (el.dataset.below) {
      const a = METRICS[el.dataset.below];
      el.style.top = `${a.top + a.cap + Number(el.dataset.gap || 0)}px`;
    }
    const box = {
      size,
      left: parseFloat(el.style.left) || 0,
      top: parseFloat(el.style.top) || 0,
      width: m.actualBoundingBoxLeft + m.actualBoundingBoxRight,
      cap: m.actualBoundingBoxAscent * sy,
    };
    if (el.id) METRICS[el.id] = box;
  });
  /* Anything that hangs off a word: the cream square after LABS, etc. */
  document.querySelectorAll("[data-after]").forEach((el) => {
    const a = METRICS[el.dataset.after];
    el.style.left = `${a.left + a.width + Number(el.dataset.dx || 0)}px`;
    el.style.top = `${a.top + a.cap - el.offsetHeight}px`;
  });
}

/* ---------- render every field once, with one shared WebGL2 context ---------- */
function renderFields() {
  const gl = document.createElement("canvas").getContext("webgl2", { preserveDrawingBuffer: true, antialias: false });
  if (!gl) return; // flat ground fallback, never a dot tile
  const vs = gl.createShader(gl.VERTEX_SHADER);
  gl.shaderSource(vs, "#version 300 es\nin vec2 a_position;\nvoid main(){gl_Position=vec4(a_position,0.0,1.0);}");
  gl.compileShader(vs);
  const programs = {};
  const program = (idx) => {
    if (programs[idx]) return programs[idx];
    const fs = gl.createShader(gl.FRAGMENT_SHADER);
    gl.shaderSource(fs, `${CL.head}float sourcePattern(vec2 p, float time, int source) {\n${CL.bodies[idx] ?? ""}\n${CL.fallback}\n}\n\n${CL.tail}`);
    gl.compileShader(fs);
    if (!gl.getShaderParameter(fs, gl.COMPILE_STATUS)) console.error(gl.getShaderInfoLog(fs));
    const pr = gl.createProgram();
    gl.attachShader(pr, vs); gl.attachShader(pr, fs);
    gl.bindAttribLocation(pr, 0, "a_position");
    gl.linkProgram(pr);
    return (programs[idx] = pr);
  };
  const buf = gl.createBuffer();
  gl.bindBuffer(gl.ARRAY_BUFFER, buf);
  gl.bufferData(gl.ARRAY_BUFFER, new Float32Array([-1, -1, 1, -1, -1, 1, 1, 1]), gl.STATIC_DRAW);
  const rgb = (hex) => [0, 2, 4].map((i) => parseInt(hex.slice(1 + i, 3 + i), 16) / 255);

  document.querySelectorAll("canvas.field").forEach((cv) => {
    const d = cv.dataset;
    const w = Math.round(cv.offsetWidth * DPR), h = Math.round(cv.offsetHeight * DPR);
    gl.canvas.width = w; gl.canvas.height = h;
    gl.viewport(0, 0, w, h);
    const idx = CL.sources[d.src];
    const pr = program(idx);
    gl.useProgram(pr);
    gl.enableVertexAttribArray(0);
    gl.vertexAttribPointer(0, 2, gl.FLOAT, false, 0, 0);
    const u = (n) => gl.getUniformLocation(pr, n);
    gl.uniform2f(u("u_resolution"), w, h);
    gl.uniform1f(u("u_pixelRatio"), DPR);
    gl.uniform2f(u("u_ripplePoint"), 0.5, 0.5);
    gl.uniform1f(u("u_rippleAge"), -1);
    gl.uniform1f(u("u_time"), Number(d.t));
    gl.uniform1f(u("u_size"), Number(d.cell));
    gl.uniform1f(u("u_scale"), Number(d.scale));
    gl.uniform1f(u("u_rotation"), (Number(d.rot) * Math.PI) / 180);
    gl.uniform1f(u("u_contrast"), Number(d.contrast));
    gl.uniform1f(u("u_balance"), Number(d.balance));
    gl.uniform1f(u("u_rippleStrength"), 0);
    gl.uniform1i(u("u_source"), idx);
    gl.uniform1i(u("u_dither"), 2); // 4x4 Bayer
    gl.uniform3fv(u("u_foreground"), rgb(d.fg));
    gl.uniform3fv(u("u_background"), rgb(d.bg));
    gl.uniform1i(u("u_useTexture"), 0);
    gl.uniform1f(u("u_texAspect"), 1);
    gl.drawArrays(gl.TRIANGLE_STRIP, 0, 4);
    cv.width = w; cv.height = h;
    cv.getContext("2d").drawImage(gl.canvas, 0, 0);
  });
  gl.getExtension("WEBGL_lose_context")?.loseContext();
}

document.fonts.ready.then(() => {
  fitType();
  renderFields();
  document.body.dataset.ready = "1";
});
</script>
</body>
</html>
